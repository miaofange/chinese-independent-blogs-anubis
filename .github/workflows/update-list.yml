name: Sync upstream blogs

on:
  schedule:
    - cron: "17 3 * * *" # 每日一次（UTC，避开整点）；上游内容提交约 2 次/天
  workflow_dispatch: # 手动触发按钮

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream CSV
        run: |
          mkdir -p data
          curl -fsSL -o data/blogs-original.csv \
            https://raw.githubusercontent.com/timqian/chinese-independent-blogs/master/blogs-original.csv

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Convert to Anubis + uBlacklist formats
        run: node scripts/convert.mjs

      - name: Commit if changed
        run: |
          git config user.name "list-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data out
          # 上游没变化就不提交：也避免累积空提交（GitHub 会停用 60 天无活动的定时任务，
          # 而这里的每次真实提交都算活动，恰好自愈）。
          git diff --cached --quiet || { git commit -m "sync upstream $(date -u +%F)"; git push; }
